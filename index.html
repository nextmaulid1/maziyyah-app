<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa085">
<title>Ma28iyyah · Maziyyah Generation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e0;--card:#fff;--ink:#111;--bd:#111;--sh:#111;--acc:#1fa085;--on:#fff;--mute:#444;
--o:#ff8a3d;--b:#5ab0ff;--y:#ffd84d;--l:#c8f169;--p:#c9b6ff;--r:8px;
--f:"Space Grotesk","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;--fh:"Archivo Black","Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:var(--ink)}
.box{background:var(--card);border:3px solid var(--bd);box-shadow:6px 6px 0 var(--sh);border-radius:var(--r)}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px}
.col{max-width:640px;margin:0 auto}
.lg{display:block;aspect-ratio:111/152;height:auto;--lw:2.4}
h1,h2,h3{font-family:var(--fh);text-transform:uppercase;margin:0}
h2{display:inline-block;font-size:clamp(20px,5vw,30px);margin:0 0 18px;padding:2px 14px;border:3px solid var(--bd);border-radius:var(--r);box-shadow:5px 5px 0 var(--sh);background:var(--y);color:#111;transform:rotate(-1deg)}
section{padding:26px 0}
/* tombol & input */
.btn{font-weight:700;border:3px solid var(--bd);border-radius:var(--r);background:var(--y);color:#111;padding:8px 18px;box-shadow:4px 4px 0 var(--sh);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.p{background:var(--acc);color:var(--on)}.btn.b{background:var(--b)}.btn.l{background:var(--l)}.btn.o{background:var(--o)}.btn.s{font-size:13px;padding:4px 12px;box-shadow:3px 3px 0 var(--sh)}
input,textarea,select{width:100%;border:3px solid var(--bd);background:var(--card);padding:9px 12px;margin:5px 0;border-radius:var(--r)}
.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.eye .ic{width:22px;height:22px}
input[type=color]{padding:2px;height:46px;cursor:pointer}
input[type=file]{display:none}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.err{color:#d12d12;font-weight:700;min-height:22px}
.meta{font-size:12px;color:var(--mute)}
.note{background:var(--y);color:#111;border:3px solid var(--bd);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
hr{border:0;border-top:3px solid var(--bd);margin:14px 0}
/* boot & login */
#boot{min-height:100svh;display:grid;place-items:center;font:700 20px var(--fh)}
#auth{min-height:100svh;display:grid;place-items:center;padding:20px}
.alang{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:auto}
.login{width:min(100%,420px);padding:28px 24px;text-align:center}
.login .lg{width:104px;margin:0 auto 14px}
.login h1{font-size:clamp(26px,7vw,34px);line-height:1.05;margin-bottom:10px}
.login h1 span{background:var(--acc);color:var(--on);padding:0 8px;border:3px solid var(--bd);display:inline-block;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--sh);margin-top:6px}
.stk{display:inline-block;background:var(--p);color:#111;font-weight:700;font-size:13px;padding:3px 14px;border:3px solid var(--bd);border-radius:var(--r);box-shadow:3px 3px 0 var(--sh);transform:rotate(1.5deg);margin-bottom:18px}
.login form{text-align:left}
.login .btn{width:100%;justify-content:center;margin-top:8px;padding:11px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--acc);color:var(--on);border-bottom:3px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
.top .row{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1020px;margin:0 auto}
.top .lg{width:34px;--lw:3.4}
.brand{font:20px var(--fh);letter-spacing:.5px;margin-right:auto}
.top select{width:auto;margin:0;padding:5px 8px;font-size:13px;font-weight:700;box-shadow:3px 3px 0 var(--sh);color:#111;background:#fff}
.top .av{width:40px;height:40px;cursor:pointer;border:3px solid var(--bd);box-shadow:3px 3px 0 var(--sh)}
.tabs{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;max-width:1020px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;text-decoration:none;color:#111;font-weight:700;font-size:14px;padding:4px 14px;border:3px solid #111;border-radius:var(--r);background:#fff;box-shadow:3px 3px 0 #111;display:inline-flex;gap:6px;align-items:center}
.tab[aria-current=page]{background:var(--y);transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
.bdg{background:#e11d48;color:#fff;font:700 11px/1 var(--f);padding:3px 6px;border-radius:99px;border:2px solid #111;font-style:normal}
.mq{background:var(--y);color:#111;border-block:3px solid var(--bd);overflow:hidden;white-space:nowrap;font:16px var(--fh);padding:4px 0}
.mq div{display:inline-block;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq div{animation:none}html{scroll-behavior:auto}}
/* avatar */
.av{width:44px;height:44px;border:3px solid var(--bd);border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none;padding:0}
.av img{width:100%;height:100%;object-fit:cover}.av.xl{width:112px;height:112px;font-size:42px;margin:0 auto 10px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.who span{display:flex;flex-direction:column;line-height:1.25}
/* composer & feed */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips button{white-space:nowrap;font-weight:700;font-size:13px;padding:3px 12px;border:3px solid var(--bd);border-radius:var(--r);background:var(--card);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--on);box-shadow:3px 3px 0 var(--sh)}
.comp{padding:14px;margin-bottom:18px}
.comp .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.comp select{width:auto;margin:0}
.prev{position:relative;margin:8px 0;border:3px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#000}
.prev img,.prev video{display:block;width:100%;max-height:300px;object-fit:contain}
.prev button{position:absolute;top:6px;right:6px}
.post{padding:14px;margin-bottom:18px;color:#111}
.post:nth-child(3n+1){background:#d6f3ea}.post:nth-child(3n+2){background:#ffe1cc}.post:nth-child(3n){background:#e4dbff}
.post .meta{color:#333}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.post .who{color:#111}
.chip{display:inline-block;background:#111;color:#fff;font-weight:700;font-size:12px;padding:1px 10px;border-radius:var(--r)}
.post h3{font-size:19px;margin:10px 0 2px}
.post p{white-space:pre-wrap;margin:8px 0 0;overflow-wrap:anywhere}
.media{display:block;width:100%;max-height:560px;object-fit:cover;margin-top:10px;border:3px solid #111;border-radius:var(--r);background:#000}
video.media{object-fit:contain}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#111;background:#fff;border:3px solid #111;border-radius:var(--r);padding:3px 10px;cursor:pointer;box-shadow:3px 3px 0 #111}
.act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
.act.on{background:var(--y)}.act.lk.on{background:#ffc2cf}.act.lk.on .ic,.act.sv.on .ic{fill:#111}
.act.del{margin-left:auto;background:#ffd2d2}
.cm{margin-top:12px;border-top:3px solid #111;padding-top:10px}
.c{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.c .av{width:32px;height:32px;font-size:13px}.c>div{flex:1;min-width:0;overflow-wrap:anywhere}
.c .x{background:none;border:0;font:700 20px/1 var(--f);cursor:pointer;color:#111}
.cf{display:flex;gap:8px}.cf input{margin:0;background:#fff;color:#111}
/* alumni & struktur */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 16px}
.tools input{flex:1;min-width:200px;margin:0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.names button{display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;color:#111;border:3px solid var(--bd);border-radius:var(--r);padding:8px 12px;box-shadow:4px 4px 0 var(--sh);cursor:pointer}
.names button:nth-child(5n+1){background:var(--l)}.names button:nth-child(5n+2){background:#ffd2b0}.names button:nth-child(5n+3){background:#c3e1ff}.names button:nth-child(5n+4){background:var(--y)}.names button:nth-child(5n){background:var(--p)}
.names button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.names .av{width:36px;height:36px;font-size:14px}
.chart{display:flex;flex-direction:column;align-items:center}
.node{padding:16px 20px;width:100%;max-width:480px;color:#111}
.node h3{font-size:19px;margin:0 0 10px;display:inline-block;padding:0 12px;border:3px solid #111;border-radius:var(--r);background:#fff}
.node.k{background:var(--o)}.node.b{background:var(--b)}.node.s{background:var(--l)}
.pp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff6;border:0;padding:4px;border-radius:var(--r);cursor:pointer;color:#111;font-weight:700;margin:2px 0}
.pp:hover{background:#fff}
.stem{width:4px;height:34px;background:var(--bd)}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:24px;position:relative;width:100%}
.kids::before{content:"";position:absolute;top:0;left:25%;right:25%;border-top:4px solid var(--bd)}
.kids .node{position:relative;margin:34px auto 0}
.kids .node::before{content:"";position:absolute;top:-38px;left:50%;width:4px;height:38px;background:var(--bd);transform:translateX(-50%)}
.prof{padding:22px;background:var(--l);color:#111}.prof p{margin:0 0 12px}
.prof .k{background:#fff;font-weight:700;padding:8px 14px;border:3px solid #111;border-radius:var(--r);display:inline-block;margin-top:6px}
.social{display:flex;gap:12px;margin-top:18px}
.social a{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border:3px solid var(--bd);border-radius:var(--r);box-shadow:4px 4px 0 var(--sh);color:#111}
.social a:nth-child(1){background:var(--acc);color:var(--on)}.social a:nth-child(2){background:var(--o)}.social a:nth-child(3){background:var(--b)}
.social svg{width:26px;height:26px}
/* pesan */
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:12px;cursor:pointer;color:var(--ink)}
.row .tx{flex:1;min-width:0}.row .tx b,.row .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{padding:0;overflow:hidden}
.chat .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:3px solid var(--bd);background:var(--acc);color:var(--on)}
.chat .hd .who{color:var(--on)}
.bubbles{height:min(56vh,480px);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:80%;padding:7px 12px;border:3px solid var(--bd);border-radius:var(--r);overflow-wrap:anywhere;white-space:pre-wrap}
.bb small{display:block;font-size:11px;opacity:.7;text-align:right}
.bb.me{align-self:flex-end;background:var(--y);color:#111;box-shadow:3px 3px 0 var(--sh)}
.bb.th{align-self:flex-start;background:var(--card)}
.chat form{display:flex;gap:8px;padding:10px;border-top:3px solid var(--bd)}.chat form input{margin:0}
.row.new{background:var(--y);color:#111}.row.new .meta{color:#333}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:90vw;background:var(--y);color:#111;font-weight:700;padding:10px 16px;border:3px solid var(--bd);border-radius:var(--r);box-shadow:5px 5px 0 var(--sh)}
/* dialog */
dialog{border:3px solid var(--bd);border-radius:var(--r);box-shadow:8px 8px 0 var(--sh);background:var(--card);color:var(--ink);padding:20px;width:min(92vw,440px);max-height:90svh}
dialog::backdrop{background:#000a}
dialog h3{font-size:21px;margin-bottom:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.sw button{width:34px;height:34px;border:3px solid var(--bd);border-radius:var(--r);cursor:pointer;box-shadow:2px 2px 0 var(--sh);padding:0}
.lab{font-weight:700;font-size:14px;display:block;margin-top:8px}
@media (max-width:700px){.kids{grid-template-columns:1fr}.kids::before{display:none}}
/* profil halaman penuh */
.pf{padding:22px 18px;text-align:center;margin-bottom:18px}
.pf h3{font-size:24px;margin:4px 0}
.pf .bio{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 10px}
.pf .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.pf .stats button{background:none;border:0;cursor:pointer;font-weight:700;padding:2px 8px;color:var(--ink)}
.pf .stats b{font-size:18px}
.pf .pa{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
.chips button:disabled{opacity:.5;cursor:not-allowed}
.row .nt{display:block;overflow-wrap:anywhere;line-height:1.35}
.row.go{cursor:pointer}
/* kamera */
.camv{position:relative;background:#000;border:3px solid var(--bd);border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-height:58svh;margin:0 auto 10px}
.camv video{width:100%;height:100%;object-fit:cover;display:block}
.camv .rec{position:absolute;top:8px;left:8px;background:#e11d48;color:#fff;font:700 13px/1 var(--f);padding:5px 9px;border-radius:99px;border:2px solid #111}
</style>
</head>

<div class="toast" id="toast" hidden role="status"></div>
<div id="boot" data-i18n="boot">Memuat…</div>

<!-- ============ LOGIN ============ -->
<div id="auth" hidden>
<select class="alang" id="langA" aria-label="Bahasa"></select>
<div class="box login">
<svg class="lg" role="img" aria-label="Logo Maziyyah Generation"><use href="#lg"/></svg>
<span class="stk">The Generation of Greatness</span>
<h1 data-i18n-html="login_title"></h1>

<button class="btn p" id="lgo" data-i18n="login_btn"></button>
</form>
<p class="meta" data-i18n="login_help"></p>
</div>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app" hidden>
<header class="top">
<div class="row">
<svg class="lg" aria-hidden="true"><use href="#lg"/></svg>
<b class="brand">MA28IYYAH</b>
<select id="langH" aria-label="Bahasa"></select>
<button class="av" id="meBtn" aria-label="Akun"></button>
</div>

<section data-view="home"><div class="col">

<div class="box comp">
<span class="meta" id="asLbl"></span>
<input id="pTitle" maxlength="120" data-ph="title_ph">
<textarea id="pBody" rows="3" maxlength="2000" data-ph="compose_ph"></textarea>
<div class="prev" id="prev" hidden></div>
<div class="r">
<label class="btn s" for="pFile" tabindex="0" id="pickBtn"><svg class="ic"><use href="#i-img"/></svg><span data-i18n="add_media"></span></label>

about:["Maziyyah Generation is the name of a generation that comes from the Arabic word Al-Maziyyah, meaning excellence, distinction, and advantage.","The name was given by the late Drs. K.H. Mu'tashim Billah, M.H.I. (may Allah forgive him), in the hope and prayer that this generation grows to excel in knowledge, noble character, personality, and service to religion, society, and the nation.","The name was also given with the prayers and hopes of his family and the masyayikh of Pondok Pesantren Darussalam Bogor. It is more than an identity: it is a prayer, a message, and a trust meant to guide this generation on its journey.","Maziyyah Generation is part of the history of Pondok Pesantren Darussalam Bogor, coinciding with three decades (30 years) since the pesantren was founded — a long journey of struggle, sacrifice, education, and service in raising the next generation of the ummah.","As a generation of santri, Maziyyah Generation is expected to carry on pesantren values, preserve the tradition of knowledge, uphold noble character, and develop their potential to face the challenges of the times. Every santri has their own distinction and potential that must keep being honed, developed, and directed so it benefits others.","Carrying this name, prayer, and hope, Maziyyah Generation is determined to be a generation that not only excels in achievement, but is also firm in faith, noble in character, broad in insight, and always devoted to religion, alma mater, society, and nation."],

about:["마지야 제너레이션은 '탁월함, 특별함, 우수함'을 뜻하는 아랍어 알-마지야(Al-Maziyyah)에서 비롯된 세대의 이름입니다.","이 이름은 고(故) K.H. 무타심 빌라(Drs. K.H. Mu'tashim Billah, M.H.I.) 선생님께서 지어 주셨으며, 이 세대가 학문의 탁월함과 고결한 품성, 인격, 그리고 종교와 사회와 국가를 위한 헌신에서 뛰어난 세대로 성장하기를 바라는 소망과 기도가 담겨 있습니다.","이 이름에는 선생님의 가족과 다루살람 보고르 이슬람 기숙학교(Pondok Pesantren Darussalam Bogor) 원로 스승님들의 기도와 바람도 함께 담겨 있습니다. 이는 단순한 이름이 아니라 이 세대의 여정을 이끌어 줄 기도이자 메시지이며 맡겨진 사명입니다.","마지야 제너레이션은 기숙학교 설립 30주년이라는 뜻깊은 시기와 맞물려 다루살람 보고르 기숙학교 역사의 일부가 되었습니다. 이는 투쟁과 희생, 교육과 헌신으로 다음 세대를 길러 온 긴 여정입니다.","산트리 세대로서 마지야 제너레이션은 기숙학교의 가치를 이어 가고, 학문의 전통을 지키며, 고결한 품성을 높이 받들고, 시대의 도전에 맞서 자신의 잠재력을 키워 나가야 합니다. 모든 산트리는 저마다의 특별함과 잠재력이 있으며, 이를 꾸준히 갈고닦아 다른 사람에게 도움이 되도록 해야 합니다.","이 이름과 기도와 바람을 안고, 마지야 제너레이션은 성과에서 뛰어날 뿐 아니라 신앙이 굳건하고 품성이 고결하며 식견이 넓고, 종교와 모교, 사회와 국가를 위해 늘 헌신하는 세대가 되겠다고 다짐합니다."],

about_title:"マズィーヤについて",
about:["マズィーヤ・ジェネレーションは、「卓越・特別・優れた点」を意味するアラビア語「アル＝マズィーヤ（Al-Maziyyah）」に由来する世代の名前です。","この名前は、故 Drs. K.H. ムタシム・ビッラー（M.H.I.）師（アッラーが赦されますように）が授けたもので、この世代が学問の卓越、高潔な人格、そして宗教・社会・国家への奉仕において優れた世代へと成長するようにとの願いと祈りが込められています。","この名前には、師のご家族とダルサラーム・ボゴール・イスラム寄宿学校（Pondok Pesantren Darussalam Bogor）の師たちの祈りと願いも込められています。単なる呼び名ではなく、この世代の歩みを導く祈りであり、メッセージであり、託された使命です。","マズィーヤ・ジェネレーションは、学校創立30周年という節目に重なり、ダルサラーム・ボゴール寄宿学校の歴史の一部となりました。それは、闘い、犠牲、教育、そして奉仕を重ねて次の世代を育ててきた長い道のりです。","サントリ（寄宿学校の学生）の世代として、マズィーヤ・ジェネレーションには、寄宿学校の価値を受け継ぎ、学問の伝統を守り、高潔な人格を重んじ、時代の課題に立ち向かうために自らの可能性を伸ばしていくことが期待されています。すべてのサントリには、それぞれの特別さと可能性があり、それを磨き、伸ばし、他者の役に立つよう導かなければなりません。","この名前、祈り、願いを胸に、マズィーヤ・ジェネレーションは、成果に優れるだけでなく、信仰に堅く、人格が高潔で、視野が広く、宗教・母校・社会・国家のために尽くし続ける世代となることを誓います。"],

about:["Maziyyah Generation téh ngaran hiji generasi anu asalna tina basa Arab, nyaéta Al-Maziyyah, anu hartina kaunggulan, kaistiméwaan, jeung kaleuwihan.","Ngaran ieu dipaparinkeun ku Almarhum Al-Maghfurlah Drs. K.H. Mu'tashim Billah, M.H.I., kalayan harepan jeung doa sangkan generasi ieu tumuwuh jadi generasi anu unggul dina élmu pangaweruh, luhur akhlak, kapribadian, sarta ngabdi ka agama, masarakat, jeung bangsa.","Pamaparin ngaran ieu ogé dibarengan ku doa jeung harepan ti kulawarga Almarhum sarta para masyayikh Pondok Pesantren Darussalam Bogor. Ngaran éta lain ukur identitas, tapi mangrupa doa, pesen, jeung amanah anu diharepkeun salawasna jadi pituduh dina lalampahan generasi ieu.","Ayana Maziyyah Generation jadi bagian tina sajarah Pondok Pesantren Darussalam Bogor, pas jeung moméntum tilu dasawarsa (30 taun) ngadegna pondok pesantren. Lalampahan panjang anu pinuh ku perjuangan, pangorbanan, atikan, jeung pangabdian dina nyiptakeun generasi panerus umat.","Salaku generasi santri, Maziyyah Generation diharepkeun bisa neruskeun nilai-nilai kapesantrenan, ngajaga tradisi kaélmuan, ngaluhurkeun akhlak, sarta mekarkeun potensi diri pikeun nyanghareupan tangtangan jaman. Unggal santri boga kaistiméwaan jeung potensi séwang-séwangan anu kudu terus diasah, dimekarkeun, jeung diarahkeun sangkan bisa méré mangpaat pikeun batur.","Mawa ngaran, doa, jeung harepan éta, Maziyyah Generation boga tekad jadi generasi anu lain ukur unggul dina prestasi, tapi ogé kuat iman, luhur akhlak, lega wawasan, sarta salawasna ngabdikeun diri pikeun agama, almamater, masarakat, jeung bangsa."],

about:["Maziyyah Generation iku jeneng sawijining generasi sing asale saka basa Arab, yaiku Al-Maziyyah, tegese kaunggulan, kaistimewaan, lan kaluwihan.","Jeneng iki diparingake dening Almarhum Al-Maghfurlah Drs. K.H. Mu'tashim Billah, M.H.I., kanthi pangarep-arep lan donga supaya generasi iki thukul dadi generasi sing unggul ing ngelmu, luhur akhlake, kapribadene, lan ngabdi marang agama, masyarakat, lan bangsa.","Pamarikan jeneng iki uga dibarengi donga lan pangarep-arep saka kulawarga Almarhum lan para masyayikh Pondok Pesantren Darussalam Bogor. Jeneng iku dudu mung identitas, nanging uga donga, pitutur, lan amanah sing dikarepake tansah dadi pepadhang ing lakune generasi iki.","Anane Maziyyah Generation dadi bagéyan saka sajarah Pondok Pesantren Darussalam Bogor, pas karo momentum telung dasawarsa (30 taun) madege pondok pesantren. Lelakon dawa sing kebak perjuangan, pangorbanan, pendidikan, lan pengabdian kanggo nyiapake generasi panerus umat.","Minangka generasi santri, Maziyyah Generation dikarepake bisa nerusake nilai-nilai kepesantrenan, njaga tradisi keilmuan, njunjung dhuwur akhlak, lan ngembangake potensi dhiri kanggo ngadhepi tantangan jaman. Saben santri nduweni kaistimewaan lan potensi dhewe-dhewe sing kudu terus diasah, dikembangake, lan diarahake supaya bisa menehi manfaat tumrap liyane.","Kanthi nggawa jeneng, donga, lan pangarep-arep kuwi, Maziyyah Generation duwe tekad dadi generasi sing ora mung unggul ing prestasi, nanging uga kukuh imane, luhur akhlake, jembar wawasane, lan tansah ngabdi marang agama, almamater, masyarakat, lan bangsa."],

 if(!ids.length)return;
 const [l,s]=await Promise.all([sb.from("likes").select("post_id").eq("user_id",me.id).in("post_id",ids),sb.from("saves").select("post_id").eq("user_id",me.id)]);
 (l.data||[]).forEach(r=>myLikes.add(r.post_id));mySaves=new Set((s.data||[]).map(r=>r.post_id));
}
async function loadPosts(){
 let q=sb.from("posts").select("*,likes(count),comments(count)").order("created_at",{ascending:false}).limit(limit);
 if(cat!=="all")q=q.eq("cat",cat);
 const {data,error}=await q;
 const list=(data||[]).map(norm);feedIds=list.map(p=>p.id);hasMore=list.length===limit;
 if(!error)await hydrate(feedIds);
 renderChips();renderFeed();
}
function mediaHTML(p){
 if(!p.media_url)return "";
 return p.media_type==="video"?`<video class="media" src="${esc(p.media_url)}" controls playsinline preload="metadata"></video>`:`<img class="media" src="${esc(p.media_url)}" alt="" loading="lazy">`;
}
function postHTML(p){
 const u=byId[p.user_id],liked=myLikes.has(p.id),sv=mySaves.has(p.id),mine=p.user_id===me.id;
 return `<article class="box post" data-post="${p.id}"><header class="ph"><button class="who" data-p="${p.user_id}">${avatar(u,p.author)}<span><b>${esc(p.author||u?.name)}</b><small class="meta">${ago(p.created_at)}</small></span></button><span class="chip">${esc(catName(p.cat))}</span></header>${p.title?`<h3>${esc(p.title)}</h3>`:""}${p.body?`<p>${esc(p.body)}</p>`:""}${mediaHTML(p)}<div class="acts"><button class="act lk${liked?" on":""}" data-act="like" aria-pressed="${liked}" aria-label="${t("act_like")}">${ic("heart")}<b>${p.lc}</b></button><button class="act" data-act="cmt" aria-label="${t("act_cmt")}">${ic("cmt")}<b>${p.cc}</b></button><button class="act sv${sv?" on":""}" data-act="save" aria-pressed="${sv}" aria-label="${t("act_save")}">${ic("mark")}</button>${mine?`<button class="act del" data-act="del" aria-label="${t("del")}">${ic("trash")}</button>`:""}</div><div class="cm" hidden></div></article>`;
}
function fillList(el,ids,emptyKey){
 el.innerHTML=ids.map(id=>postHTML(P.get(id))).join("")||`<p>${t(emptyKey)}</p>`;
 ids.forEach(id=>{if(openCm.has(id))openComments(id,el)});
}
function renderFeed(){if(!me)return;fillList($("feed"),feedIds,"no_posts");$("moreBtn").hidden=!hasMore}
function renderSaved(){if(me)fillList($("savedList"),savedIds,"no_saved")}
async function loadSaved(){
 const {data}=await sb.from("saves").select("created_at,posts(*,likes(count),comments(count))").eq("user_id",me.id).order("created_at",{ascending:false});
 const list=(data||[]).filter(r=>r.posts).map(r=>norm(r.posts));savedIds=list.map(p=>p.id);
 await hydrate(savedIds);renderSaved();
}
function refreshCard(id){
 document.querySelectorAll(`[data-post="${id}"]`).forEach(card=>{
  const wrap=document.createElement("div");wrap.innerHTML=postHTML(P.get(id));const n=wrap.firstElementChild;
  card.replaceWith(n);if(openCm.has(id))openComments(id,n.parentElement);
 });
}

async function loadComments(id){

}
function cmHTML(id){
 const p=P.get(id),list=cmts[id]||[];
 return (list.map(c=>{const u=byId[c.user_id],can=c.user_id===me.id||p.user_id===me.id;

async function openComments(id,scope){

 if(!cmts[id])await loadComments(id);
 (scope||document).querySelectorAll(`[data-post="${id}"] .cm`).forEach(el=>{el.hidden=false;el.innerHTML=cmHTML(id)});

function stripStorage(url){const m=/\/object\/public\/media\/(.+)$/.exec(url||"");return m?decodeURIComponent(m[1]):null}
document.addEventListener("click",async e=>{
 const pt=e.target.closest("[data-ptab]");if(pt){setPTab(pt.dataset.ptab);return}
  const pb=e.target.closest("[data-p]");if(pb){showProfile(pb.dataset.p);return}
 const b=e.target.closest("[data-act]");if(!b){const g=e.target.closest("[data-go]");if(g)goTo(g.dataset.go);return}
 const act=b.dataset.act,card=b.closest("[data-post]"),id=card?+card.dataset.post:null,p=id?P.get(id):null;
 if(act==="like"&&p){
  if(myLikes.has(id)){myLikes.delete(id);p.lc--;refreshCard(id);await sb.from("likes").delete().eq("post_id",id).eq("user_id",me.id)}
  else{myLikes.add(id);p.lc++;refreshCard(id);const r=await sb.from("likes").insert({post_id:id});if(r.error&&r.error.code!=="23505"){myLikes.delete(id);p.lc--;refreshCard(id)}}
 }else if(act==="save"&&p){
  if(mySaves.has(id)){mySaves.delete(id);refreshCard(id);await sb.from("saves").delete().eq("post_id",id).eq("user_id",me.id);if(tab==="saved")loadSaved()}
  else{mySaves.add(id);refreshCard(id);const r=await sb.from("saves").insert({post_id:id});if(r.error&&r.error.code!=="23505"){mySaves.delete(id);refreshCard(id)}}
 }else if(act==="cmt"&&p){
  const cm=card.querySelector(".cm");
  if(!cm.hidden){cm.hidden=true;openCm.delete(id)}else await openComments(id,card.parentElement);
 }else if(act==="cdel"){
  if(!confirm(t("cm_confirm")))return;const pid=+b.dataset.pid;
  const r=await sb.from("comments").delete().eq("id",b.dataset.c);
  if(!r.error){cmts[pid]=cmts[pid].filter(c=>String(c.id)!==b.dataset.c);P.get(pid).cc=Math.max(0,P.get(pid).cc-1);refreshCard(pid)}
 }else if(act==="del"&&p){
  if(!confirm(t("confirm_del")))return;
  const r=await sb.from("posts").delete().eq("id",id);
  if(!r.error){const path=stripStorage(p.media_url);if(path)sb.storage.from("media").remove([path]).then(()=>{});
   feedIds=feedIds.filter(x=>x!==id);savedIds=savedIds.filter(x=>x!==id);if(pf&&pf.ids){pf.ids=pf.ids.filter(x=>x!==id);if(pf.counts?.posts)pf.counts.posts--}P.delete(id);renderFeed();renderSaved();renderProfile();if(tab==="post")location.hash="#home"}
 }else if(act==="follow"){toggleFollow(b.dataset.id)}
 else if(act==="dm"){if(location.hash==="#msg")openChat(b.dataset.id);else{pendingChat=b.dataset.id;location.hash="#msg"}}
 else if(act==="editme"){openMe()}
 else if(act==="chat"){openChat(b.dataset.id)}
  else if(act==="pfmore"&&pf){pf.limit+=20;loadProfilePosts()}
});

/* ---------- POSTING + FOTO/VIDEO ---------- */
function clearPending(){if(pending?.url)URL.revokeObjectURL(pending.url);pending=null;$("prev").hidden=true;$("prev").innerHTML="";$("pFile").value=""}
const MAXSEC=45;
function videoDur(f){return new Promise(ok=>{const v=document.createElement("video"),u=URL.createObjectURL(f);const done=d=>{URL.revokeObjectURL(u);v.removeAttribute("src");ok(d)};v.preload="metadata";v.onloadedmetadata=()=>done(v.duration);v.onerror=()=>done(NaN);setTimeout(()=>done(NaN),5000);v.src=u})}
async function acceptFile(f,o={}){
 const err=$("perr");err.textContent="";if(!f)return;
 const vid=f.type.startsWith("video/"),img=f.type.startsWith("image/");
 if(!vid&&!img){$("pFile").value="";return err.textContent=t("err_type")}
 if(vid&&f.size>MAXVID){$("pFile").value="";return err.textContent=t("err_big")}
 if(vid&&o.cam&&!o.known){const d=await videoDur(f);if(Number.isFinite(d)&&d>MAXSEC+1)return err.textContent=t("cam_long")}
 clearPending();pending={file:f,vid,url:URL.createObjectURL(f)};
 $("prev").innerHTML=(vid?`<video src="${pending.url}" controls playsinline preload="metadata"></video>`:`<img src="${pending.url}" alt="">`)+`<button class="btn s o" type="button" id="prevX">${t("remove")}</button>`;
 $("prev").hidden=false;$("prevX").onclick=clearPending;
}
$("pFile").onchange=e=>acceptFile(e.target.files[0]);
$("pickBtn").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("pFile").click()}};
async function imgBlob(file,max=1600){
 let bm;try{bm=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bm=await createImageBitmap(file)}
 const k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
 c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("blob")),"image/jpeg",.82));
}
$("postBtn").onclick=async()=>{
 if(busy||!me)return;
 const title=$("pTitle").value.trim(),body=$("pBody").value.trim(),err=$("perr");err.textContent="";
 if(!body&&!pending)return;
 busy=true;$("postBtn").disabled=true;$("postBtn").textContent=t("sending");
 try{
  let media_url=null,media_type=null;
  if(pending){
   let blob=pending.file,ct=pending.file.type,ext;
   if(pending.vid){ext=ct==="video/webm"?"webm":ct==="video/quicktime"?"mov":"mp4";media_type="video"}
   else if(ct==="image/gif"){ext="gif";media_type="image"}
   else{blob=await imgBlob(pending.file);ct="image/jpeg";ext="jpg";media_type="image"}
   const path=`${me.id}/${Date.now()}.${ext}`;
   const up=await sb.storage.from("media").upload(path,blob,{contentType:ct,cacheControl:"31536000"});if(up.error)throw up.error;
   media_url=sb.storage.from("media").getPublicUrl(path).data.publicUrl;
  }
  const r=await sb.from("posts").insert({title,body,cat:$("pCat").value,media_url,media_type});if(r.error)throw r.error;
  $("pTitle").value=$("pBody").value="";clearPending();cat="all";await loadPosts();
 }catch(x){err.textContent=t("err_post")}
 busy=false;$("postBtn").disabled=false;$("postBtn").textContent=t("post_btn");
};

 let err=null;
 if(following.has(id)){const r=await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",id);if(r.error)err=r.error;else following.delete(id)}

function updateNBadge(){const n=notifs.filter(x=>!x.read_at&&I18N.id["nt_"+x.type]).length,b=$("nbdg");b.hidden=!n;b.textContent=n>99?"99+":n}
async function loadNotifs(){
 if(!me)return;
 const {data,error}=await sb.from("notifications").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(120);
 notifOk=!error;if(!error)notifs=data||[];
 updateNBadge();renderNotif();
}
function markNotifsRead(){
 const un=notifs.filter(n=>!n.read_at);if(!un.length)return;
 const now=new Date().toISOString();
 un.forEach(n=>{nfresh.add(n.id);n.read_at=now});
 updateNBadge();renderNotif();
 sb.from("notifications").update({read_at:now}).eq("user_id",me.id).in("id",un.map(n=>n.id)).then(()=>{});
}
function nTpl(type,cnt){const k="nt_"+type+(cnt>1?"_m":"");return t(I18N.id[k]?k:"nt_"+type,{n:"@@N@@",m:cnt-1})}
function groupNotifs(){
 const out=[],likes=new Map();
 for(const n of notifs){
  if(n.type==="like_post"||n.type==="like_comment"){
   const key=n.type+":"+(n.type==="like_post"?n.post_id:n.comment_id);let g=likes.get(key);
   if(!g){g={...n,actors:[],unread:false};likes.set(key,g);out.push(g)}
   g.actors.push(n.actor_id);if(!n.read_at||nfresh.has(n.id))g.unread=true;
  }else out.push({...n,actors:[n.actor_id],unread:!n.read_at||nfresh.has(n.id)});
 }
 return out;
}
function renderNotif(){
 if(!me)return;
 const box=$("notifList");
 if(!notifOk){box.innerHTML=`<p>${t("err_notif")}</p>`;return}
 box.innerHTML=groupNotifs().map(g=>{
  const u=byId[g.actor_id];if(!u||!I18N.id["nt_"+g.type])return "";
  const html=esc(nTpl(g.type,g.actors.length)).replace("@@N@@",()=>`<strong>${esc(u.name)}</strong>`);
  const isF=g.type==="follow",go=isF?"u:"+u.kode:"post:"+g.post_id;
  const act=isF?(following.has(g.actor_id)?`<button class="btn s b" data-act="dm" data-id="${g.actor_id}">${t("send_dm")}</button>`:`<button class="btn s p" data-act="follow" data-id="${g.actor_id}">${t("follow_back")}</button>`):"";
  const hl=g.unread||(isF&&!following.has(g.actor_id));
  return `<div class="box row go${hl?" new":""}" role="link" tabindex="0" data-go="${esc(go)}"><button class="who" data-p="${g.actor_id}" aria-label="${esc(u.name)}">${avatar(u)}</button><span class="tx"><span class="nt">${html}</span>${g.snippet?`<small class="meta">${esc(g.snippet)}</small>`:""}<small class="meta">${ago(g.created_at)}</small></span>${act}</div>`;
 }).join("")||`<p>${t("notif_none")}</p>`;
}
function goTo(g){const [k,v]=String(g).split(":");if(k==="u")location.hash="#u-"+v;else if(k==="post")location.hash="#post-"+v}

async function loadConvos(){
 if(!me)return;
 const [{data},c]=await Promise.all([
  sb.from("messages").select("*").or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order("created_at",{ascending:false}).limit(300),
  sb.from("messages").select("*",{count:"exact",head:true}).eq("receiver_id",me.id).is("read_at",null)]);
 conv=new Map();
 (data||[]).forEach(m=>{const o=m.sender_id===me.id?m.receiver_id:m.sender_id;let e=conv.get(o);if(!e){e={last:m,unread:0};conv.set(o,e)}if(m.receiver_id===me.id&&!m.read_at)e.unread++});
 unread=c.count??0;updateBadge();
}
function updateBadge(){const b=$("bdg");b.hidden=!unread;b.textContent=unread>99?"99+":unread}
function renderMsgs(){
 if(!me)return;
 const ids=new Set([...following].filter(x=>followers.has(x)));conv.forEach((_,k)=>ids.add(k));
 const list=[...ids].map(id=>byId[id]).filter(Boolean).sort((a,b)=>{const x=conv.get(a.id)?.last?.created_at||"",y=conv.get(b.id)?.last?.created_at||"";return x<y?1:x>y?-1:a.name.localeCompare(b.name)});
 $("msgList").hidden=!!chatWith;$("chat").hidden=!chatWith;
 if(chatWith)return;
 $("msgList").innerHTML=`<p class="meta">${t("msg_help")}</p>`+(list.map(u=>{const c=conv.get(u.id);
  return `<button class="box row" data-act="chat" data-id="${u.id}">${avatar(u)}<span class="tx"><b>${esc(u.name)}</b><small class="meta">${c?esc((c.last.sender_id===me.id?t("you")+": ":"")+c.last.body):""}</small></span>${c?.unread?`<i class="bdg">${c.unread}</i>`:""}</button>`}).join("")||`<p>${t("no_friends")}</p>`);
}
async function loadChat(id,quiet){
 const {data}=await sb.from("messages").select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me.id})`).order("created_at",{ascending:false}).limit(200);
 if(chatWith!==id)return;
 const list=(data||[]).reverse();
 const bx=$("bubbles"),atEnd=bx.scrollHeight-bx.scrollTop-bx.clientHeight<80;
 bx.innerHTML=list.map(m=>`<div class="bb ${m.sender_id===me.id?"me":"th"}">${esc(m.body)}<small>${clock(m.created_at)}</small></div>`).join("")||`<p class="meta" style="margin:auto">${t("no_msgs")}</p>`;
 if(!quiet||atEnd)bx.scrollTop=bx.scrollHeight;
 if(list.some(m=>m.receiver_id===me.id&&!m.read_at)){await sb.from("messages").update({read_at:new Date().toISOString()}).eq("receiver_id",me.id).eq("sender_id",id).is("read_at",null);loadConvos()}
}
function openChat(id){
 const u=byId[id];if(!u)return;chatWith=id;$("chatErr").textContent="";
 $("chatWho").innerHTML=`<button class="who" data-p="${id}">${avatar(u)}<span><b>${esc(u.name)}</b></span></button>`;
 $("chatForm").hidden=false;if(!mutual(id)){$("chatErr").textContent=t("not_mutual");$("chatForm").hidden=true}
 renderMsgs();loadChat(id);
}
$("chatBack").onclick=()=>{chatWith=null;loadConvos().then(renderMsgs);renderMsgs()};
$("chatForm").onsubmit=async e=>{
 e.preventDefault();const body=$("chatIn").value.trim();if(!body||!chatWith)return;
 $("chatIn").disabled=true;
 const r=await sb.from("messages").insert({receiver_id:chatWith,body});
 $("chatIn").disabled=false;
 if(r.error){$("chatErr").textContent=mutual(chatWith)?t("err_send"):t("not_mutual");return}
 $("chatErr").textContent="";$("chatIn").value="";$("chatIn").focus();await loadChat(chatWith);loadConvos();
};
function startRealtime(){
 if(chan)sb.removeChannel(chan);
 chan=sb.channel("dm-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`receiver_id=eq.${me.id}`},()=>{
  if(chatWith)loadChat(chatWith,true);loadConvos().then(()=>{if(!chatWith)renderMsgs()});
 }).on("postgres_changes",{event:"INSERT",schema:"public",table:"follows",filter:`following_id=eq.${me.id}`},async()=>{
   await loadFollows();renderAlumni();renderMsgs();refreshProfileFollows();
  }).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`user_id=eq.${me.id}`},async ev=>{
   await loadNotifs();
   if(tab==="notif")markNotifsRead();
   else{const n=ev.new,u=byId[n?.actor_id];if(u&&I18N.id["nt_"+n.type])toast(nTpl(n.type,1).replace("@@N@@",()=>u.name))}
  }).subscribe();
 clearInterval(pollT);
 pollT=setInterval(()=>{if(document.hidden||!me)return;loadFollows();loadNotifs().then(()=>{if(tab==="notif")markNotifsRead()});loadConvos().then(()=>{if(chatWith)loadChat(chatWith,true);else if(tab==="msg")renderMsgs()})},20000);
}

function openMe(){
 $("meName").value=me.name;$("meJob").value=me.job||"";$("meBio").value=me.bio||"";$("dpNote").hidden=!me.dp;$("merr").textContent="";
 $("meAv").innerHTML=me.photo_url?`<img src="${esc(me.photo_url)}" alt="">`:esc(me.name[0]);
 $("dMe").showModal();
}
$("meBtn").onclick=openMe;
$("dMe").addEventListener("close",hidePw);
$("saveProf").onclick=async()=>{const n=$("meName").value.trim();if(!n)return;
 const {error}=await sb.from("profiles").update({name:n.slice(0,60),job:$("meJob").value.trim().slice(0,80),bio:$("meBio").value.trim().slice(0,300)}).eq("id",me.id);
 $("merr").textContent=error?t("err_save"):t("ok_saved");if(!error)await refreshMe()};
$("savePw").onclick=async()=>{const p=$("np").value;if(p.length<6)return $("merr").textContent=t("pw_min");
 const r=await sb.auth.updateUser({password:p});if(r.error)return $("merr").textContent=t("err_pw");
 await sb.from("profiles").update({dp:false}).eq("id",me.id);$("np").value="";$("merr").textContent=t("pw_ok");await refreshMe()};
async function refreshMe(){await loadUsers();me=byId[me.id];renderHeader();renderAlumni();renderOrg();$("dpNote").hidden=!me.dp}
$("mePhoto").onclick=()=>{$("pf").value="";$("pf").click()};
async function avatarBlob(file){
 let bm;try{bm=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bm=await createImageBitmap(file)}
 const s=400,c=document.createElement("canvas");c.width=c.height=s;const k=Math.max(s/bm.width,s/bm.height),w=bm.width*k,h=bm.height*k;
 c.getContext("2d").drawImage(bm,(s-w)/2,(s-h)/2,w,h);return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),"image/jpeg",.85));
}
$("pf").onchange=async e=>{const f=e.target.files[0];if(!f||!me)return;
 try{const b=await avatarBlob(f),path=me.id+"/avatar.jpg";
  const up=await sb.storage.from("avatars").upload(path,b,{upsert:true,contentType:"image/jpeg"});if(up.error)throw up.error;
  const url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
  const r=await sb.from("profiles").update({photo_url:url}).eq("id",me.id);if(r.error)throw r.error;
  $("merr").textContent=t("photo_ok");await refreshMe();$("meAv").innerHTML=`<img src="${esc(url)}" alt="">`;
 }catch(x){$("merr").textContent=t("photo_err")}};

let savedBrand=null,brandSaved=false;
function swatches(el,list,inp){el.innerHTML=list.map(c=>`<button type="button" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join("");
 el.onclick=e=>{const b=e.target.closest("[data-c]");if(b){inp.value=b.dataset.c;preview()}}}

swatches($("swA"),ACC_PRESETS,$("cA"));swatches($("swB"),BG_PRESETS,$("cB"));
$("cA").oninput=$("cB").oninput=preview;
$("brandBtn").onclick=()=>{$("dMe").close();savedBrand={...brand};brandSaved=false;$("cA").value=brand.accent;$("cB").value=brand.bg;$("berr").textContent="";$("dBrand").showModal()};
$("bReset").onclick=()=>{$("cA").value=DEF.accent;$("cB").value=DEF.bg;preview()};
$("bCancel").onclick=()=>$("dBrand").close();

 if(error)return $("berr").textContent=t("err_save");
 me.accent=a;me.bg=b;applyBrand({accent:a,bg:b});saveLocal();brandSaved=true;$("dBrand").close();
};

/* ---------- KAMERA ---------- */
let cam={stream:null,audio:null,rec:null,chunks:[],timer:null,secs:0,facing:"environment",mode:"photo"};
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function camRelease(){
 clearInterval(cam.timer);
 if(cam.rec){cam.rec.ondataavailable=null;cam.rec.onstop=null;if(cam.rec.state!=="inactive"){try{cam.rec.stop()}catch(e){}}}
 cam.rec=null;cam.chunks=[];
 [cam.stream,cam.audio].forEach(s=>s&&s.getTracks().forEach(x=>x.stop()));cam.stream=cam.audio=null;
 $("camVid").srcObject=null;$("camTimer").hidden=true;
}
function camUI(){
 const rec=!!(cam.rec&&cam.rec.state==="recording");
 document.querySelectorAll("#camModes [data-m]").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.m===cam.mode);b.disabled=rec});
 $("camFlip").disabled=rec;$("camTimer").hidden=!rec;
 $("camShot").textContent=cam.mode==="photo"?t("cam_shoot"):rec?t("cam_stop"):t("cam_rec");
 $("camShot").classList.toggle("p",!rec);$("camShot").classList.toggle("o",rec);
}
function camFail(key,keep){$("camErr").textContent=t(key);$("camFb").hidden=false;$("camShot").disabled=!keep;camUI()}
async function camStart(){
 camRelease();$("camErr").textContent="";
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cam.facing},width:{ideal:1280},height:{ideal:720}},audio:false});
  if(!$("dCam").open){s.getTracks().forEach(x=>x.stop());return}
  cam.stream=s;const v=$("camVid");v.srcObject=s;v.style.transform=cam.facing==="user"?"scaleX(-1)":"none";await v.play().catch(()=>{});
  $("camFb").hidden=true;$("camShot").disabled=false;camUI();
 }catch(e){camFail("cam_denied")}
}
$("camBtn").onclick=()=>{
 cam.mode="photo";$("camFb").hidden=true;$("camErr").textContent="";$("dCam").showModal();
 if(!navigator.mediaDevices?.getUserMedia)return camFail("cam_denied");
 camUI();camStart();
};
$("dCam").addEventListener("close",camRelease);
$("camModes").onclick=e=>{const b=e.target.closest("[data-m]");if(!b||b.disabled)return;cam.mode=b.dataset.m;$("camErr").textContent="";camUI()};
$("camFlip").onclick=()=>{cam.facing=cam.facing==="user"?"environment":"user";camStart()};
function camSnap(){
 const v=$("camVid");if(!v.videoWidth)return;
 const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 c.toBlob(b=>{if(!b)return;$("dCam").close();acceptFile(new File([b],"kamera.jpg",{type:"image/jpeg"}),{cam:true,known:true})},"image/jpeg",.9);
}
async function camRecord(){
 if(!cam.stream)return;
 const types=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"];
 const mt=window.MediaRecorder&&types.find(x=>MediaRecorder.isTypeSupported(x));
 if(!mt)return camFail("cam_norec",true);
 const tracks=[...cam.stream.getVideoTracks()];
 try{cam.audio=await navigator.mediaDevices.getUserMedia({audio:true});tracks.push(...cam.audio.getAudioTracks())}catch(e){cam.audio=null}
 if(!$("dCam").open||!cam.stream){camRelease();return}
 const base=mt.startsWith("video/mp4")?"video/mp4":"video/webm";
 let rec;try{rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mt,videoBitsPerSecond:2500000})}catch(e){return camFail("cam_norec",true)}
 cam.rec=rec;cam.chunks=[];cam.secs=0;
 rec.ondataavailable=e=>{if(e.data&&e.data.size)cam.chunks.push(e.data)};
 rec.onstop=()=>{
  clearInterval(cam.timer);
  const blob=new Blob(cam.chunks,{type:base});
  if(cam.audio)cam.audio.getTracks().forEach(x=>x.stop());cam.audio=null;cam.rec=null;cam.chunks=[];
  if(blob.size>MAXVID){camUI();$("camErr").textContent=t("err_big");return}
  if(!blob.size){camUI();return}
  $("dCam").close();
  acceptFile(new File([blob],"kamera."+(base==="video/mp4"?"mp4":"webm"),{type:base}),{cam:true,known:true});
 };
 rec.start(1000);
 $("camTimer").textContent=mmss(0)+" / "+mmss(MAXSEC);
 cam.timer=setInterval(()=>{cam.secs++;$("camTimer").textContent=mmss(cam.secs)+" / "+mmss(MAXSEC);if(cam.secs>=MAXSEC&&cam.rec&&cam.rec.state==="recording")cam.rec.stop()},1000);
 camUI();
}
$("camShot").onclick=()=>{
 if(cam.mode==="photo")return camSnap();
 if(cam.rec&&cam.rec.state==="recording"){cam.rec.stop();return}
 camRecord();
};
for(const id of ["camPhotoIn","camVideoIn"])$(id).onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;$("dCam").close();acceptFile(f,{cam:true})};
$("seeProf").onclick=()=>{$("dMe").close();location.hash="#u-"+me.kode};
